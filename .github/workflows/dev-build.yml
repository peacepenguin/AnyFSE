name: Dev build

# Builds a test installer signed with a throwaway self-signed certificate (see scripts/Build-Dev.ps1).
# The installer bundles its own public certificate, so it installs on a real device without extra trust steps.
# Not for release: every run generates a new certificate. The revision is the workflow run number, so builds are reproducible.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Visual Studio
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          & $vswhere -all -products * -property displayName,installationVersion,installationPath

      - name: Check Windows SDK
        shell: pwsh
        run: |
          $sdks = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory | Select-Object -ExpandProperty Name
          Write-Host "Installed SDKs: $($sdks -join ', ')"
          if ($sdks -notcontains '10.0.26100.0') { throw 'Windows SDK 10.0.26100.0 is required by the projects but is not installed on this runner.' }

      - name: Build offline installer
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          $failed = $false
          try {
            ./scripts/Build-Dev.ps1 -Configuration Release -Revision ${{ github.run_number }} *>&1 | Tee-Object -FilePath $log
          } catch {
            $failed = $true
            ($_ | Out-String) | Tee-Object -FilePath $log -Append
          }
          if ($failed) {
            # Surface the failure as an annotation so it is readable without opening the raw log
            $lines = Get-Content $log
            $errors = $lines | Select-String -Pattern 'error|exception|failed|not found|throw' | Select-Object -Last 40 | ForEach-Object { $_.Line }
            $text = "Errors:`n" + ($errors -join "`n") + "`n`nLast lines:`n" + (($lines | Select-Object -Last 40) -join "`n")
            $text = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Build-Dev.ps1 failed::$text"
            exit 1
          }
          # Build-Dev has activated the C++ developer environment in this process.
          ./scripts/Test-PendingIoRecovery.ps1
          ./scripts/Test-XboxStartup.ps1

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $installer = Get-ChildItem build/Release -Filter 'AnyFSE.Installer.Offline.*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'Offline installer was not produced.' }
          Copy-Item $installer.FullName dist/
          Get-FileHash dist/* -Algorithm SHA256 | Format-Table Hash, Path -AutoSize | Out-String -Width 250 | Write-Host

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AnyFSE-dev-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 14
